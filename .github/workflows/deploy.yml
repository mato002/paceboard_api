# .github/workflows/deploy.yml
# GitHub Actions workflow to automatically deploy website files to a production server via FTP on every push to the main branch.

name: Production Deployment via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses the old naming convention

jobs:
  deploy:
    name: FTP Deploy Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code so the workflow can access its files
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Deploy Laravel app files (outside public_html on Namecheap)
      - name: Sync Laravel App To Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel: /home/zhenhlkl/paceboard  (Laravel app: app/, routes/, vendor/, .env)
          server-dir: /paceboard/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env
            **/.env.*

      # Drop stale Laravel caches so newly uploaded routes can load.
      # Do not fail the job if a cache file is already absent.
      - name: Clear Stale Laravel Caches
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          HOST="$(printf '%s' "$FTP_SERVER" | tr -d '\r' | xargs)"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          for file in config.php routes-v7.php routes.php events.php; do
            curl --silent --show-error --connect-timeout 20 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --quote "DELE /paceboard/bootstrap/cache/$file" \
              "ftp://$HOST/" || true
          done

      # Upload only deploy-hook.php. A folder sync would delete index.php.
      - name: Upload Deploy Hook PHP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$FTP_SERVER" | tr -d '\r' | xargs)"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          REMOTE="public_html/paceboard/deploy-hook.php"

          if curl --fail --show-error --silent --connect-timeout 20 --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T deploy-web/deploy-hook.php \
            "ftp://$HOST/$REMOTE"; then
            echo "Uploaded deploy-hook.php over FTP"
          elif curl --fail --show-error --silent --connect-timeout 20 --ftp-create-dirs --ssl --insecure \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T deploy-web/deploy-hook.php \
            "ftp://$HOST/$REMOTE"; then
            echo "Uploaded deploy-hook.php over FTPES"
          else
            curl --fail --show-error --silent --connect-timeout 20 --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              -T deploy-web/deploy-hook.php \
              "ftps://$HOST/$REMOTE"
            echo "Uploaded deploy-hook.php over FTPS"
          fi

          CODE="$(curl -sS -o /tmp/hook_get -w '%{http_code}' 'https://paceboard.zhengkyc.com/deploy-hook.php')"
          echo "GET https://paceboard.zhengkyc.com/deploy-hook.php => HTTP $CODE"
          cat /tmp/hook_get || true
          echo
          if [ "$CODE" != "405" ]; then
            echo "Expected HTTP 405 (hook PHP is present). Got $CODE — file is not in the document root."
            exit 1
          fi

      # Step 3: Trigger protected post-deploy tasks (migrate/cache) without SSH
      - name: Run Post-Deploy Hook
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOOK_TOKEN" ]; then
            echo "DEPLOY_HOOK_TOKEN secret is missing."
            exit 1
          fi
          echo "Calling https://paceboard.zhengkyc.com/deploy-hook.php"
          HTTP_CODE="$(curl -sS -o /tmp/hook_resp -w '%{http_code}' \
            -X POST 'https://paceboard.zhengkyc.com/deploy-hook.php' \
            -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json')"
          echo "Hook HTTP $HTTP_CODE"
          cat /tmp/hook_resp || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
