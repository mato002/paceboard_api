# Runs on every push to main: sync code via FTP, then run migrations on production.
name: Production Deployment via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy + Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Sync Laravel App To Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /paceboard/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env
            **/.env.*

      - name: Clear Laravel Route Cache On Server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deploy-web/clear_caches.py

      - name: Upload deploy-hook.php (optional)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PUBLIC_DIR: ${{ secrets.FTP_PUBLIC_DIR }}
        run: python3 deploy-web/upload_hook.py

      - name: Run Migrations On Production
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOOK_TOKEN" ]; then
            echo "GitHub secret DEPLOY_HOOK_TOKEN is required."
            exit 1
          fi

          SITE="${DEPLOY_SITE_URL:-https://paceboard.zhengkyc.com}"
          SITE="${SITE%/}"

          invoke_hook() {
            local url="$1"
            curl -sS -o /tmp/hook_resp -w '%{http_code}' \
              -X POST "$url" \
              -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json'
          }

          ENDPOINTS=(
            "$SITE/api/internal/deploy"
            "$SITE/internal/deploy"
            "$SITE/deploy-hook.php"
            "$SITE/public/deploy-hook.php"
          )

          HTTP_CODE=""
          for url in "${ENDPOINTS[@]}"; do
            echo "Trying POST $url"
            HTTP_CODE="$(invoke_hook "$url")"
            echo "=> HTTP $HTTP_CODE"
            cat /tmp/hook_resp || true
            echo

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "Deploy hook rejected the request."
              echo "On the server /paceboard/.env set:"
              echo "  DEPLOY_HOOK_ENABLED=true"
              echo "  DEPLOY_HOOK_TOKEN=<same as GitHub secret DEPLOY_HOOK_TOKEN>"
              exit 1
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "All deploy endpoints failed. Last HTTP code: $HTTP_CODE"
            exit 1
          fi

          python3 <<'PY'
          import json
          import sys

          with open("/tmp/hook_resp", encoding="utf-8") as handle:
              payload = json.load(handle)

          if not payload.get("migrations_applied"):
              print("Deploy response did not confirm migrations ran:", payload, file=sys.stderr)
              sys.exit(1)

          migrate = next(
              (r for r in payload.get("results", []) if r.get("command", "").startswith("migrate")),
              None,
          )
          if migrate is None or migrate.get("exit_code") != 0:
              print("migrate --force did not succeed:", payload, file=sys.stderr)
              sys.exit(1)

          print("Migrations completed successfully.")
          if migrate.get("output"):
              print(migrate["output"])
          PY

      - name: Deployment Summary
        if: success()
        run: echo "Code synced and php artisan migrate --force completed on production."
