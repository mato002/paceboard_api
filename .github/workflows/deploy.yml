# .github/workflows/deploy.yml
# GitHub Actions workflow to automatically deploy website files to a production server via FTP on every push to the main branch.

name: Production Deployment via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses the old naming convention

jobs:
  deploy:
    name: FTP Deploy Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code so the workflow can access its files
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Deploy the repository files to the remote FTP server
      - name: Sync Files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # The FTP server hostname or IP address (stored securely in repository secrets)
          server: ${{ secrets.FTP_SERVER }}

          # The FTP account username (stored securely in repository secrets)
          username: ${{ secrets.FTP_USERNAME }}

          # The FTP account password (stored securely in repository secrets)
          password: ${{ secrets.FTP_PASSWORD }}

          # Deploy into your Namecheap document root
          server-dir: /public_html/paceboard/

          # Laravel-safe excludes (do not overwrite runtime/secrets)
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env
            **/.env.*

      # Step 3a: Validate deploy-hook secrets exist
      - name: Validate Post-Deploy Hook Secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOOK_TOKEN }}" ]; then
            echo "DEPLOY_HOOK_TOKEN secret is missing."
            exit 1
          fi

      # Step 3b: Trigger protected post-deploy tasks (migrate/cache) without SSH
      - name: Run Post-Deploy Hook
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.DEPLOY_HOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_HOOK_TOKEN }}" \
            -H "Accept: application/json"
