# .github/workflows/deploy.yml
# GitHub Actions workflow to automatically deploy website files to a production server via FTP on every push to the main branch.

name: Production Deployment via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses the old naming convention

jobs:
  deploy:
    name: FTP Deploy Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code so the workflow can access its files
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Deploy Laravel app files (outside public_html on Namecheap)
      - name: Sync Laravel App To Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel: /home/zhenhlkl/paceboard  (Laravel app: app/, routes/, vendor/, .env)
          server-dir: /paceboard/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env
            **/.env.*

      # Upload only the standalone hook into the web document root.
      # Do not overwrite index.php (custom paths to the Laravel app).
      - name: Sync Deploy Hook To Web Root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          # Subdomain document root: /public_html/paceboard
          server-dir: /public_html/paceboard/
          exclude: |
            *
            !deploy-hook.php

      # Step 3a: Validate deploy-hook secrets exist
      - name: Validate Post-Deploy Hook Secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOOK_TOKEN }}" ]; then
            echo "DEPLOY_HOOK_TOKEN secret is missing."
            exit 1
          fi

      # Step 3b: Trigger protected post-deploy tasks (migrate/cache) without SSH
      - name: Run Post-Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          URL="$(echo -n "$DEPLOY_HOOK_URL" | tr -d '\r' | xargs)"
          echo "Calling deploy hook..."
          curl --fail --show-error --silent \
            -X POST "$URL" \
            -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json"
