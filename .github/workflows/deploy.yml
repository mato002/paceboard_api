# .github/workflows/deploy.yml
# GitHub Actions workflow to automatically deploy website files to a production server via FTP on every push to the main branch.

name: Production Deployment via FTP

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch uses the old naming convention

jobs:
  deploy:
    name: FTP Deploy Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code so the workflow can access its files
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Deploy Laravel app files (outside public_html on Namecheap)
      - name: Sync Laravel App To Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel: /home/zhenhlkl/paceboard  (Laravel app: app/, routes/, vendor/, .env)
          server-dir: /paceboard/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.env
            **/.env.*

      # Find the live index.php, upload the hook next to it, and drop stale route/config cache.
      - name: Upload Hook And Clear Caches
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 deploy-web/upload_hook.py

      # Prefer the Laravel API route; fall back to the standalone PHP file.
      - name: Run Post-Deploy Hook
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOOK_TOKEN" ]; then
            echo "DEPLOY_HOOK_TOKEN secret is missing."
            exit 1
          fi

          call_hook() {
            local url="$1"
            local code
            code="$(curl -sS -o /tmp/hook_resp -w '%{http_code}' \
              -X POST "$url" \
              -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json')"
            echo "POST $url => HTTP $code" >&2
            cat /tmp/hook_resp >&2 || true
            echo >&2
            echo "$code"
          }

          for url in \
            "https://paceboard.zhengkyc.com/api/internal/deploy" \
            "https://paceboard.zhengkyc.com/internal/deploy" \
            "https://paceboard.zhengkyc.com/deploy-hook.php"
          do
            HTTP_CODE="$(call_hook "$url" | tail -n 1)"
            if [ "$HTTP_CODE" = "200" ]; then
              exit 0
            fi
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "Hook is reachable but rejected the request (check production .env DEPLOY_HOOK_ENABLED / DEPLOY_HOOK_TOKEN)."
              exit 1
            fi
          done

          echo "All deploy hook URLs returned 404 or another error."
          exit 1
